name: Realtime F1 contracts (isolated batch)
on:
  push:
    branches:
      - feature/dhole-realtime-universal-rt-20261107-01
    paths:
      - 'src/CustomCodeFramework.Messaging/**'
      - 'tests/CustomCodeFramework.Messaging.Realtime.Tests/**'
      - 'Directory.Build.props'
      - '.github/workflows/realtime-f1-contract-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore F1 tests
        run: dotnet restore tests/CustomCodeFramework.Messaging.Realtime.Tests/CustomCodeFramework.Messaging.Realtime.Tests.csproj
      - name: Build F1 tests
        run: dotnet build tests/CustomCodeFramework.Messaging.Realtime.Tests/CustomCodeFramework.Messaging.Realtime.Tests.csproj -c Release --no-restore
      - name: Run F1 tests
        run: dotnet test tests/CustomCodeFramework.Messaging.Realtime.Tests/CustomCodeFramework.Messaging.Realtime.Tests.csproj -c Release --no-build --logger "trx;LogFileName=rt-20261107-01-f1.trx" --results-directory ./TestResults
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt-20261107-01-f1-contract-tests
          path: TestResults/
          if-no-files-found: warn
